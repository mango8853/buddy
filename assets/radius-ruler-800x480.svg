<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <pattern id="minorGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#eef0f4" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#dde2ea" stroke-width="1"/>
    </pattern>
    <style>
      .label { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #1a1d22; }
      .tiny { font-size: 10px; font-weight: 600; }
      .small { font-size: 12px; font-weight: 700; }
      .title { font-size: 22px; font-weight: 800; }
      .note { font-size: 11px; font-weight: 600; fill: #5f6673; }
      .sampleText { font-size: 12px; font-weight: 800; }
    </style>
  </defs>

  <rect width="800" height="480" fill="#fbfcfe"/>
  <rect x="0" y="0" width="800" height="480" fill="url(#minorGrid)"/>
  <rect x="0" y="0" width="800" height="480" fill="url(#majorGrid)"/>

  <rect x="0" y="0" width="800" height="34" fill="#ffffff" opacity="0.92"/>
  <rect x="0" y="0" width="34" height="480" fill="#ffffff" opacity="0.92"/>
  <line x1="34" y1="0" x2="34" y2="480" stroke="#cfd6e2" stroke-width="1.5"/>
  <line x1="0" y1="34" x2="800" y2="34" stroke="#cfd6e2" stroke-width="1.5"/>

  <g stroke="#818a98">
    <line x1="50" y1="0" x2="50" y2="12" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="18" stroke-width="1.5"/>
    <line x1="150" y1="0" x2="150" y2="12" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="18" stroke-width="1.5"/>
    <line x1="250" y1="0" x2="250" y2="12" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="18" stroke-width="1.5"/>
    <line x1="350" y1="0" x2="350" y2="12" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="18" stroke-width="1.5"/>
    <line x1="450" y1="0" x2="450" y2="12" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="18" stroke-width="1.5"/>
    <line x1="550" y1="0" x2="550" y2="12" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="18" stroke-width="1.5"/>
    <line x1="650" y1="0" x2="650" y2="12" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="18" stroke-width="1.5"/>
    <line x1="750" y1="0" x2="750" y2="12" stroke-width="1"/>
  </g>
  <g stroke="#818a98">
    <line x1="0" y1="50" x2="12" y2="50" stroke-width="1"/>
    <line x1="0" y1="100" x2="18" y2="100" stroke-width="1.5"/>
    <line x1="0" y1="150" x2="12" y2="150" stroke-width="1"/>
    <line x1="0" y1="200" x2="18" y2="200" stroke-width="1.5"/>
    <line x1="0" y1="250" x2="12" y2="250" stroke-width="1"/>
    <line x1="0" y1="300" x2="18" y2="300" stroke-width="1.5"/>
    <line x1="0" y1="350" x2="12" y2="350" stroke-width="1"/>
    <line x1="0" y1="400" x2="18" y2="400" stroke-width="1.5"/>
    <line x1="0" y1="450" x2="12" y2="450" stroke-width="1"/>
  </g>

  <g class="label tiny" text-anchor="middle">
    <text x="100" y="28">100</text>
    <text x="200" y="28">200</text>
    <text x="300" y="28">300</text>
    <text x="400" y="28">400</text>
    <text x="500" y="28">500</text>
    <text x="600" y="28">600</text>
    <text x="700" y="28">700</text>
    <text x="790" y="28">800</text>
  </g>
  <g class="label tiny" text-anchor="middle">
    <text x="18" y="104">100</text>
    <text x="18" y="204">200</text>
    <text x="18" y="304">300</text>
    <text x="18" y="404">400</text>
    <text x="18" y="474">480</text>
  </g>

  <text class="label title" x="56" y="64">Pixel Ruler</text>
  <text class="label small" x="56" y="92">800 x 480 screen</text>
  <text class="label note" x="56" y="112">density reported by Android: 240 dpi</text>
  <text class="label note" x="56" y="128">8 mm at 240 dpi is about 76 px, but WebView physical units are usually not exact.</text>

  <rect x="56" y="156" width="250" height="270" rx="16" fill="#ffffff" stroke="#dde2ea"/>
  <text class="label small" x="74" y="184">Quick reading guide</text>
  <text class="label note" x="74" y="206">1. Top and left rulers are in px.</text>
  <text class="label note" x="74" y="224">2. Compare your UI corner with the</text>
  <text class="label note" x="74" y="240">   samples on the right.</text>
  <text class="label note" x="74" y="264">3. If you want, we can then lock the</text>
  <text class="label note" x="74" y="280">   whole app to one radius scale.</text>

  <g transform="translate(74 308)">
    <rect x="0" y="0" width="64" height="64" rx="8" fill="#f7b0b0"/>
    <rect x="86" y="0" width="64" height="64" rx="16" fill="#f8d08e"/>
    <rect x="172" y="0" width="64" height="64" rx="24" fill="#bfe8a5"/>
    <text class="label tiny sampleText" x="32" y="84" text-anchor="middle">8 px</text>
    <text class="label tiny sampleText" x="118" y="84" text-anchor="middle">16 px</text>
    <text class="label tiny sampleText" x="204" y="84" text-anchor="middle">24 px</text>
  </g>

  <g transform="translate(350 66)">
    <text class="label small" x="0" y="0">Radius samples</text>

    <rect x="0" y="22" width="118" height="56" rx="8" fill="#f6b7b7"/>
    <text class="label tiny sampleText" x="59" y="56" text-anchor="middle">R 8 px</text>

    <rect x="136" y="22" width="118" height="56" rx="12" fill="#f9c990"/>
    <text class="label tiny sampleText" x="195" y="56" text-anchor="middle">R 12 px</text>

    <rect x="272" y="22" width="118" height="56" rx="16" fill="#f7e08f"/>
    <text class="label tiny sampleText" x="331" y="56" text-anchor="middle">R 16 px</text>

    <rect x="408" y="22" width="118" height="56" rx="20" fill="#cae8a2"/>
    <text class="label tiny sampleText" x="467" y="56" text-anchor="middle">R 20 px</text>

    <rect x="0" y="104" width="118" height="56" rx="24" fill="#bfe7cb"/>
    <text class="label tiny sampleText" x="59" y="138" text-anchor="middle">R 24 px</text>

    <rect x="136" y="104" width="118" height="56" rx="32" fill="#b7e4e8"/>
    <text class="label tiny sampleText" x="195" y="138" text-anchor="middle">R 32 px</text>

    <rect x="272" y="104" width="118" height="56" rx="48" fill="#bfd3f5"/>
    <text class="label tiny sampleText" x="331" y="138" text-anchor="middle">R 48 px</text>

    <rect x="408" y="104" width="118" height="56" rx="64" fill="#d4c3f3"/>
    <text class="label tiny sampleText" x="467" y="138" text-anchor="middle">R 64 px</text>

    <rect x="0" y="186" width="526" height="148" rx="76" fill="#fde2ee"/>
    <text class="label small sampleText" x="263" y="266" text-anchor="middle">R 76 px  ≈  8 mm at 240 dpi</text>
    <text class="label note" x="263" y="286" text-anchor="middle">Use this as a rough physical target, not a guaranteed exact measurement.</text>
  </g>
</svg>
